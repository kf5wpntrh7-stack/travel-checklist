<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#30465f">
<title>出國行李清單</title>
<style>
:root {
  --bg:#f2f4f7;
  --card:#ffffff;
  --navy:#30465f;
  --navy2:#496781;
  --blue:#8fb2d7;
  --line:#dce2e8;
  --text:#24313d;
  --muted:#6c7a86;
  --ok:#dcefdc;
  --todo:#fff0bf;
  --buy:#f7d4d4;
  --skip:#e8e8e8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
button,input,select,textarea{font:inherit}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;padding:14px 14px 12px;box-shadow:0 4px 18px rgba(29,45,60,.18)}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0}
.small{font-size:12px;opacity:.82}
.progress{margin-top:10px;background:rgba(255,255,255,.18);height:8px;border-radius:20px;overflow:hidden}
.progress span{display:block;height:100%;background:#d8ebff;width:0;transition:.2s}
.summary{display:flex;gap:8px;margin-top:9px;overflow:auto}
.pill{white-space:nowrap;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 9px;font-size:12px}
main{max-width:760px;margin:auto;padding:12px 12px 100px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 10px rgba(40,55,70,.05)}
.panel-title{padding:11px 13px;background:var(--blue);color:white;font-weight:700}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.field label{font-size:12px;color:var(--muted);display:block;margin:0 0 5px}
.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.warning{margin:0 12px 12px;background:#fff4c8;border:1px solid #ebd67c;border-radius:10px;padding:10px;font-size:13px;line-height:1.45}
.toolbar{display:flex;gap:8px;padding:12px;overflow:auto}
.btn{border:0;border-radius:10px;padding:9px 12px;background:#e9edf1;color:var(--text);font-weight:600;white-space:nowrap}
.btn.primary{background:var(--navy);color:#fff}
.search{width:100%;padding:0 12px 12px}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.category{margin-bottom:12px}
.category-head{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;padding:11px 13px;border-radius:12px 12px 0 0;font-weight:700;position:sticky;top:118px;z-index:5}
.category-count{font-size:12px;opacity:.85}
.items{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;overflow:hidden}
.item{padding:12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-top{display:flex;gap:9px;align-items:flex-start}
.item-name{flex:1;font-weight:700;line-height:1.35}
.delete{border:0;background:transparent;color:#9a5b5b;font-size:18px;padding:0 3px}
.row{display:grid;grid-template-columns:90px 1fr;gap:8px;margin-top:9px;align-items:center}
.row label{font-size:12px;color:var(--muted)}
.row input,.row select,.row textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;background:white}
.row textarea{min-height:56px;resize:vertical}
.status-ready{background:var(--ok)!important}
.status-todo{background:var(--todo)!important}
.status-buy{background:var(--buy)!important}
.status-skip{background:var(--skip)!important}
.add-wrap{padding:10px 12px 12px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;border:0;border-radius:999px;background:var(--navy);color:white;padding:14px 18px;font-weight:700;box-shadow:0 8px 22px rgba(36,49,61,.28)}
.modal{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:50;display:none;align-items:flex-end}
.modal.show{display:flex}
.sheet{width:100%;background:white;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow:auto}
.sheet h2{font-size:18px;margin:0 0 12px}
.sheet .field{margin-bottom:10px}
.sheet select,.sheet input,.sheet textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.sheet-actions{display:flex;gap:8px;margin-top:12px}
.sheet-actions button{flex:1}
.hidden{display:none!important}
@media(min-width:700px){
  .item{padding:14px}
  .item-body{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .row.note{grid-column:1/-1}
}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div>
      <h1>✈️ 出國行李清單</h1>
      <div class="small">手機版・自動儲存</div>
    </div>
    <button class="btn" onclick="window.print()">列印</button>
  </div>
  <div class="progress"><span id="progressBar"></span></div>
  <div class="summary">
    <div class="pill" id="sumTotal">總項目 0</div>
    <div class="pill" id="sumReady">已準備 0</div>
    <div class="pill" id="sumBuy">待購買 0</div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-title">🌍 旅遊基本資訊</div>
    <div class="info-grid">
      <div class="field"><label>前往國家／城市</label><input id="destination" placeholder="例如：德國"></div>
      <div class="field"><label>當地天氣</label><input id="weather" placeholder="例如：20–25°C"></div>
      <div class="field"><label>出遊天數</label><input id="days" placeholder="例如：6 天 5 夜"></div>
      <div class="field"><label>同行旅伴</label><input id="companions" placeholder="例如：1 人"></div>
      <div class="field"><label>去程航班</label><input id="outbound" placeholder="航空／航班／日期"></div>
      <div class="field"><label>回程航班</label><input id="returnFlight" placeholder="航空／航班／日期"></div>
      <div class="field"><label>隨身行李</label><input id="carryOn" placeholder="件數／尺寸"></div>
      <div class="field"><label>托運行李</label><input id="checkedBag" placeholder="件數／重量"></div>
    </div>
    <div class="warning">⚠️ 出發前請再次確認護照效期、簽證、航空行李、液體、行動電源、食品與藥品規定。</div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <button class="btn primary" onclick="openAdd()">＋ 新增項目</button>
      <button class="btn" onclick="exportBackup()">備份</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">匯入</button>
      <button class="btn" onclick="resetAll()">重設</button>
      <input id="importFile" class="hidden" type="file" accept="application/json" onchange="importBackup(event)">
    </div>
    <div class="search"><input id="searchBox" placeholder="搜尋物品、備註或位置…" oninput="render()"></div>
  </section>

  <div id="list"></div>
</main>

<button class="fab" onclick="openAdd()">＋ 新增</button>

<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="sheet">
    <h2>新增行李項目</h2>
    <div class="field"><label>分類</label><select id="newCategory"></select></div>
    <div class="field"><label>項目名稱</label><input id="newName" placeholder="例如：暖暖包"></div>
    <div class="field"><label>數量</label><input id="newQty" type="number" min="0" value="1"></div>
    <div class="field"><label>狀態</label>
      <select id="newStatus">
        <option>待準備</option><option>✔ 已準備</option><option>待購買</option><option>✖ 不攜帶</option>
      </select>
    </div>
    <div class="field"><label>位置</label>
      <select id="newLocation">
        <option>托運行李</option><option>手提行李</option><option>後背包</option><option>隨身小包</option><option>身上</option><option>未指定</option>
      </select>
    </div>
    <div class="field"><label>備註</label><textarea id="newNote"></textarea></div>
    <div class="sheet-actions">
      <button class="btn" onclick="hideModal()">取消</button>
      <button class="btn primary" onclick="addItem()">新增</button>
    </div>
  </div>
</div>

87", "category": "✏️ 其他", "name": "小筆記本", "qty": 1, "status": "待準備", "location": "手提行李", "note": ""}, {"id": "item_88", "category": "✏️ 其他", "name": "零食", "qty": 1, "status": "待準備", "location": "手提行李", "note": "食品請確認入境規定"}, {"id": "item_89", "category": "✏️ 其他", "name": "衣架", "qty": 2, "status": "待準備", "location": "托運行李", "note": ""}, {"id": "item_90", "category": "✏️ 其他", "name": "夾鏈袋", "qty": 5, "status": "待準備", "location": "托運行李", "note": ""}, {"id": "item_91", "category": "✏️ 其他", "name": "備用購物袋", "qty": 1, "status": "待準備", "location": "後背包", "note": ""}];
const CATEGORIES = ["🧳 行李", "🪪 證件", "💻 3C", "👕 衣物", "🧴 生活用品", "💊 藥品", "✏️ 其他"];
const STORAGE_KEY = "dorayaki_travel_checklist_v1";
const INFO_KEY = "dorayaki_travel_info_v1";
let items = loadItems();

function loadItems(){
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(saved) ? saved : structuredClone(DEFAULT_ITEMS);
  } catch(e) {
    return structuredClone(DEFAULT_ITEMS);
  }
}
function saveItems(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); updateSummary(); }
function saveInfo(){
  const info={};
  ["destination","weather","days","companions","outbound","returnFlight","carryOn","checkedBag"].forEach(id=>info[id]=document.getElementById(id).value);
  localStorage.setItem(INFO_KEY, JSON.stringify(info));
}
function loadInfo(){
  try {
    const info=JSON.parse(localStorage.getItem(INFO_KEY)||"{}");
    Object.entries(info).forEach(([k,v])=>{const el=document.getElementById(k); if(el) el.value=v||"";});
  } catch(e) {}
}
function statusClass(status){
  if(status==="✔ 已準備") return "status-ready";
  if(status==="待購買") return "status-buy";
  if(status==="✖ 不攜帶") return "status-skip";
  return "status-todo";
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[s]));
}
function render(){
  const q=(document.getElementById("searchBox").value||"").trim().toLowerCase();
  const groups={};
  CATEGORIES.forEach(c=>groups[c]=[]);
  items.forEach(item=>{
    const hay=[item.name,item.note,item.location,item.status,item.category].join(" ").toLowerCase();
    if(!q || hay.includes(q)){
      if(!groups[item.category]) groups[item.category]=[];
      groups[item.category].push(item);
    }
  });
  const root=document.getElementById("list");
  root.innerHTML="";
  Object.entries(groups).forEach(([category, arr])=>{
    if(!arr.length) return;
    const section=document.createElement("section");
    section.className="category";
    section.innerHTML=`<div class="category-head"><span>${esc(category)}</span><span class="category-count">${arr.length} 項</span></div><div class="items"></div>`;
    const box=section.querySelector(".items");
    arr.forEach(item=>box.appendChild(itemCard(item)));
    root.appendChild(section);
  });
  updateSummary();
}
function itemCard(item){
  const el=document.createElement("div");
  el.className="item";
  el.innerHTML=`
    <div class="item-top">
      <div class="item-name">${esc(item.name)}</div>
      <button class="delete" aria-label="刪除" onclick="removeItem('${item.id}')">×</button>
    </div>
    <div class="item-body">
      <div class="row"><label>數量</label><input type="number" min="0" value="${esc(item.qty)}" onchange="updateItem('${item.id}','qty',Number(this.value))"></div>
      <div class="row"><label>狀態</label>
        <select class="${statusClass(item.status)}" onchange="this.className=statusClass(this.value);updateItem('${item.id}','status',this.value)">
          ${["待準備","✔ 已準備","待購買","✖ 不攜帶"].map(v=>`<option ${v===item.status?"selected":""}>${v}</option>`).join("")}
        </select>
      </div>
      <div class="row"><label>位置</label>
        <select onchange="updateItem('${item.id}','location',this.value)">
          ${["托運行李","手提行李","後背包","隨身小包","身上","未指定"].map(v=>`<option ${v===item.location?"selected":""}>${v}</option>`).join("")}
        </select>
      </div>
      <div class="row note"><label>備註</label><textarea onchange="updateItem('${item.id}','note',this.value)">${esc(item.note)}</textarea></div>
    </div>`;
  return el;
}
function updateItem(id,key,value){
  const item=items.find(x=>x.id===id);
  if(item){item[key]=value;saveItems();}
}
function removeItem(id){
  if(confirm("確定刪除這個項目嗎？")){items=items.filter(x=>x.id!==id);saveItems();render();}
}
function updateSummary(){
  const total=items.filter(x=>x.status!=="✖ 不攜帶").length;
  const ready=items.filter(x=>x.status==="✔ 已準備").length;
  const buy=items.filter(x=>x.status==="待購買").length;
  document.getElementById("sumTotal").textContent=`總項目 ${total}`;
  document.getElementById("sumReady").textContent=`已準備 ${ready}`;
  document.getElementById("sumBuy").textContent=`待購買 ${buy}`;
  document.getElementById("progressBar").style.width=(total?Math.round(ready/total*100):0)+"%";
}
function openAdd(){
  document.getElementById("newCategory").innerHTML=CATEGORIES.map(c=>`<option>${c}</option>`).join("");
  document.getElementById("newName").value="";
  document.getElementById("newQty").value=1;
  document.getElementById("newStatus").value="待準備";
  document.getElementById("newLocation").value="托運行李";
  document.getElementById("newNote").value="";
  document.getElementById("modal").classList.add("show");
}
function hideModal(){document.getElementById("modal").classList.remove("show");}
function closeModal(e){if(e.target.id==="modal") hideModal();}
function addItem(){
  const name=document.getElementById("newName").value.trim();
  if(!name){alert("請輸入項目名稱");return;}
  items.push({
    id:"item_"+Date.now(),
    category:document.getElementById("newCategory").value,
    name,
    qty:Number(document.getElementById("newQty").value||1),
    status:document.getElementById("newStatus").value,
    location:document.getElementById("newLocation").value,
    note:document.getElementById("newNote").value.trim()
  });
  saveItems();hideModal();render();
}
function exportBackup(){
  const payload={
    version:1,
    exportedAt:new Date().toISOString(),
    info:JSON.parse(localStorage.getItem(INFO_KEY)||"{}"),
    items
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="出國行李清單備份.json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importBackup(event){
  const file=event.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data.items)) throw new Error();
      items=data.items;
      localStorage.setItem(STORAGE_KEY,JSON.stringify(items));
      if(data.info) localStorage.setItem(INFO_KEY,JSON.stringify(data.info));
      loadInfo();render();alert("匯入完成");
    }catch(e){alert("備份檔格式不正確");}
  };
  reader.readAsText(file);
  event.target.value="";
}
function resetAll(){
  if(!confirm("確定恢復成原始範本嗎？目前修改會被清除。")) return;
  items=structuredClone(DEFAULT_ITEMS);
  localStorage.removeItem(INFO_KEY);
  ["destination","weather","days","companions","outbound","returnFlight","carryOn","checkedBag"].forEach(id=>document.getElementById(id).value="");
  saveItems();render();
}
document.addEventListener("DOMContentLoaded",()=>{
  loadInfo();
  ["destination","weather","days","companions","outbound","returnFlight","carryOn","checkedBag"].forEach(id=>document.getElementById(id).addEventListener("input",saveInfo));
  render();
});
</script>
